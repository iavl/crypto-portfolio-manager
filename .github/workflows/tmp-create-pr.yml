name: tmp-create-pr
on:
  push:
    branches: [strategy-review-fixes]
permissions:
  contents: read
  pull-requests: write
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR for strategy-review-fixes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY_B64: |
            
        run: |
          printf '%s' "$PR_BODY_B64" | tr -d '\n' | base64 -d > /tmp/pr-body.md
          gh pr create --repo iavl/crypto-portfolio-manager \
            --base main --head strategy-review-fixes \
            --title "fix: strategy-review phases 0-7: decision-consistency fixes, stress diagnostics, evaluation harness" \
            --body-file /tmp/pr-body.md
