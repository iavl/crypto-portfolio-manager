name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[dev]"
      # Always isolate runtime state so the suite never depends on (or writes
      # to) a developer's real ~/.local/share history.
      - run: python -m unittest discover -s tests -v
        env:
          CRYPTO_PORTFOLIO_DATA_DIR: ${{ runner.temp }}/crypto-portfolio-manager-test-data
      - run: ruff check .
      - run: python -m compileall crypto_portfolio scripts
